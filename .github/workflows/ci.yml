name: Corpus Monitor CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    runs-on: ubuntu-latest
    name: Syntax + Schema Validation

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax check
        run: |
          python -m py_compile app/shrf_corpus_monitor_app.py
          python -m py_compile tools/fetch_zenodo_metrics.py
          python -m py_compile tools/validate_corpus.py
          echo "All syntax checks passed"

      - name: Corpus validation
        run: python3 tools/validate_corpus.py data/corpus.json
        continue-on-error: true

      - name: JSON structure checks
        run: |
          python3 -c "
          import json
          m = json.load(open('data/uptake-metrics-full.json'))
          r = json.load(open('data/resolution-register.json'))
          print('metrics entries:', len(m.get('entries',[])))
          print('resolution items:', len(r.get('items',[])))
          "

      - name: Invariant check
        run: |
          python3 -c "
          src = open('app/shrf_corpus_monitor_app.py').read().lower()
          for c in ['audience behaviour','corpus truth','projection layer']:
              assert c in src, 'MISSING: ' + c
          print('All invariants present')
          "
